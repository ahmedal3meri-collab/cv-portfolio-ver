<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CV → Portfolio Generator Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
/* إعدادات التصميم الأساسية */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070f;--bg2:#0d0d1a;
  --indigo:#4f46e5;--il:#818cf8;
  --pink:#ec4899;--cyan:#06b6d4;--amber:#f59e0b;--green:#10b981;
  --text:#e2e8f0;--muted:#94a3b8;
  --border:rgba(255,255,255,.08);--glass:rgba(255,255,255,.04);
  --r:16px;--fh:'Syne',sans-serif;--fb:'DM Sans',sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--fb);min-height:100vh;overflow-x:hidden}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:50px 20px 80px}
.header{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:48px;text-align:center}
h1{font-family:var(--fh);font-size:clamp(32px,5.5vw,64px);font-weight:800;background:linear-gradient(135deg,#fff,var(--il),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{width:100%;max-width:740px;background:var(--glass);border:1px solid var(--border);border-radius:24px;padding:44px;backdrop-filter:blur(20px)}
.uzone{border:2px dashed rgba(79,70,229,.3);border-radius:var(--r);padding:32px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:.3s;position:relative}
.uzone:hover{border-color:var(--cyan)}
.uzone input{position:absolute;inset:0;opacity:0;cursor:pointer}
.themes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.tc{border:2px solid var(--border);border-radius:14px;padding:10px;cursor:pointer;text-align:center;transition:.25s}
.tc.sel{border-color:var(--cyan);background:rgba(6,182,212,.1)}
.gbtn{width:100%;margin-top:28px;padding:18px;border-radius:14px;background:linear-gradient(135deg,var(--indigo),var(--pink));color:#fff;font-weight:700;border:none;cursor:pointer}
.gbtn:disabled{opacity:.5}
.pw{display:none;margin-top:20px}
.rw{display:none;margin-top:24px;text-align:center}
.rbox{background:rgba(16,185,129,.1);border:1px solid var(--green);padding:20px;border-radius:16px}
.err{display:none;color:#ff4444;margin-top:10px}
@media(max-width:640px){ .themes-grid{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>CV → Portfolio AI</h1>
    <p style="color:var(--muted)">حول سيرتك الذاتية إلى موقع احترافي خلال ثوانٍ</p>
  </div>

  <div class="card">
    <div class="uzone" id="cv-zone">
      <input type="file" id="cv-input" accept=".pdf"/>
      <div style="font-size:40px">📄</div>
      <div style="font-weight:700">ارفع ملف الـ CV (PDF)</div>
    </div>
    
    <div id="cv-name-display" style="margin-top:10px; font-size:12px; color:var(--green); text-align:center"></div>

    <div class="themes-grid" id="themes-grid">
      <div class="tc sel" data-theme="dark">Cosmic Dark</div>
      <div class="tc" data-theme="minimal">Minimal</div>
      <div class="tc" data-theme="tech">Developer</div>
    </div>

    <div class="err" id="err"></div>
    <button class="gbtn" id="gbtn">ابدأ التصميم الآن ⚡</button>

    <div class="pw" id="pw">
      <div id="status-text" style="text-align:center; margin-bottom:10px">جاري معالجة البيانات...</div>
      <div style="height:4px; background:#222; border-radius:10px overflow:hidden">
        <div id="pb" style="height:100%; width:0%; background:var(--cyan); transition:0.3s"></div>
      </div>
    </div>

    <div class="rw" id="rw">
      <div class="rbox">
        <h3 style="color:var(--green)">تم التجهيز بنجاح! 🎉</h3>
        <div style="margin-top:15px; display:flex; gap:10px; justify-content:center">
          <button class="gbtn" id="dl-btn" style="margin:0; width:auto">تحميل الملف HTML</button>
          <button class="gbtn" id="prev-btn" style="margin:0; width:auto; background:var(--bg2); border:1px solid var(--cyan)">معاينة</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
let cvFile = null;
let selTheme = 'dark';
let genHTML = '';

// اختيار الملف
document.getElementById('cv-input').addEventListener('change', (e) => {
  cvFile = e.target.files[0];
  if(cvFile) document.getElementById('cv-name-display').innerText = "تم اختيار: " + cvFile.name;
});

// اختيار الثيم
document.getElementById('themes-grid').addEventListener('click', (e) => {
  if(e.target.classList.contains('tc')) {
    document.querySelectorAll('.tc').forEach(t => t.classList.remove('sel'));
    e.target.classList.add('sel');
    selTheme = e.target.dataset.theme;
  }
});

// زر التوليد
document.getElementById('gbtn').addEventListener('click', generate);

async function generate() {
  if(!cvFile) { showErr("الرجاء رفع ملف الـ CV أولاً"); return; }
  
  hideErr();
  document.getElementById('gbtn').disabled = true;
  document.getElementById('pw').style.display = 'block';
  const pb = document.getElementById('pb');
  
  try {
    pb.style.width = "30%";
    const reader = new FileReader();
    reader.readAsDataURL(cvFile);
    
    reader.onload = async () => {
      const b64 = reader.result.split(',')[1];
      pb.style.width = "60%";
      
      const response = await fetch('/api/claude', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: "claude-haiku-4-5-20251001",
          max_tokens: 8000,
          messages: [{
            role: "user",
            content: `Generate a professional HTML portfolio using this CV (Base64). Theme: ${selTheme}. Return ONLY the HTML code starting with <!DOCTYPE html>. CV Data: ${b64}`
          }]
        })
      });

      const data = await response.json();
      if(!response.ok) throw new Error(data.error || "خطأ في الاتصال");

      let html = data.content.filter(b => b.type === 'text').map(b => b.text).join('').trim();
      const start = html.indexOf('<!DOCTYPE html>');
      if(start !== -1) html = html.substring(start);
      
      genHTML = html;
      pb.style.width = "100%";
      document.getElementById('pw').style.display = 'none';
      document.getElementById('rw').style.display = 'block';
      document.getElementById('gbtn').disabled = false;
    };
  } catch (err) {
    showErr(err.message);
    document.getElementById('gbtn').disabled = false;
  }
}

// وظائف التحميل والمعاينة
document.getElementById('dl-btn').onclick = () => {
  const blob = new Blob([genHTML], {type: 'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my-portfolio.html';
  a.click();
};

document.getElementById('prev-btn').onclick = () => {
  const win = window.open('', '_blank');
  win.document.write(genHTML);
  win.document.close();
};

function showErr(m) { const e=document.getElementById('err'); e.innerText=m; e.style.display='block'; }
function hideErr() { document.getElementById('err').style.display='none'; }
</script>
</body>
</html>
